services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: docrag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docrag}
      POSTGRES_DB: docrag
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docrag"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://docrag:${POSTGRES_PASSWORD:-docrag}@db:5432/docrag
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /srv/uploads
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads:/srv/uploads
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build: ./backend
    command: celery -A app.celery_app.celery_app worker --loglevel=info --concurrency=2
    environment: *app-env
    volumes:
      - uploads:/srv/uploads
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      api: {condition: service_started}

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
